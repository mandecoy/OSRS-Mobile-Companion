name: Probe Money Making GE Mapping
on:
  push:
    branches: ["fix/0.7.5-tablet-prices-shop-liquidity"]
    paths:
      - "scripts/probe_money_market.py"
      - ".github/workflows/probe-money-ge.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/probe_money_market.py
